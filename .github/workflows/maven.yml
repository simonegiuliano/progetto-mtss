# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 1. Compilazione
      run: |
        cd roman-number
        mvn clean compile

    # Eseguito prima del test poichè più breve (credo?) (non ha senso eseguire
    # dei test se questi non sono comunque sufficienti)
    - name: 2. Report test coverage
      run: |
          cd roman-number
          mvn coveralls:report -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }}

    - name: 3. Esecuzione Test di Unità
      run: |
        cd roman-number
        mvn test

    - name: 4. Analisi Statica (Checkstyle)
      run: |
        cd roman-number
        mvn checkstyle:check package

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
  #  - name: Update dependency graph
  #    uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
